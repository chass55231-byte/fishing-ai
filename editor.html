<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Code Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }
        h1 {
            margin-top: 20px;
        }
        .editor {
            width: 90%;
            height: 70vh;
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
            resize: none;
            font-size: 18px;
        }
        .button {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            font-size: 20px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Mobile Code Editor</h1>
    <textarea class="editor" placeholder="Type your code here..."></textarea>
    <button class="button">Save</button>
    <button class="button">Run</button>
</body>
</html>
